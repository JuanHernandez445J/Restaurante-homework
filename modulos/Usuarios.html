<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios - RICURAS LA 23</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/Usuarios.css">
</head>

<body>

    <div class="contenedor">

        <h1>RICURAS LA 23</h1>

        <h2>Registrar Usuario</h2>

        <div class="field">
            <label class="label">Nombre</label>

            <input class="input" type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
        </div>

        <div class="field">
            <label class="label">Apellido</label>

            <input class="input" type="text" id="apellido" name="apellido" required placeholder="Ingrese su apellido">
        </div>

        <div class="field">
            <label class="label">Tipo de Documento</label>

            <div class="select">
                <select id="tipoDocumento" name="tipoDocumento" required>
                    <option value="cedula">
                        Cédula de Ciudadanía
                    </option>

                    <option value="tarjetaIdentidad">
                        Tarjeta de Identidad
                    </option>

                    <option value="cedulaExtranjeria">
                        Cédula de Extranjería
                    </option>

                    <option value="pasaporte">
                        Pasaporte
                    </option>

                </select>
            </div>
        </div>

        <div class="field">
            <label class="label">Número de Documento</label>

            <input class="input" type="text" id="numeroDocumento" name="numeroDocumento" required placeholder="Ingrese su número de documento">
        </div>
        <div class="field">
            <label class="label">Teléfono</label>
            <input class="input" type="tel" id="telefono" name="telefono" required placeholder="Ingrese su número de teléfono">
        </div>

        <div class="field">
            <label class="label">Correo Electrónico</label>
            <input class="input" type="email" id="correo" name="correo" required placeholder="Ingrese su correo electrónico">
        </div>

        <div class="field">
            <label class="label">Género</label>
            <div class="select">
                <select id="genero" name="genero" required>
                    <option value="">
                        Seleccione su Género
                    </option>

                    <option value="masculino">
                        Masculino
                    </option>

                    <option value="femenino">
                        Femenino
                    </option>

                    <option value="otro">
                        Otro
                    </option>

                </select>
            </div>
        </div>

        <div class="field">
            <label class="label">Cargo</label>
            <div class="select">
                <select id="cargo" name="cargo" required>

                    <option value="">
                        Seleccione un Cargo
                    </option>

                    <option value="cliente">
                        Cliente
                    </option>

                </select>
            </div>
        </div>

        <div class="field">
            <label class="label">Fecha de nacimiento</label>
            <input class="input" type="date" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>

        <div class="field">
            <label class="label">Contraseña</label>
            <input class="input" type="password" id="contraseña" name="contraseña" required placeholder="Ingrese su contraseña">
        </div>
        <div class="botones">
            <button class="button registrar" type="submit" id="buttonUsuario"> Registrar Usuario </button>

            <a href="../index.html" class="button cancelar"> Cancelar registro </a>
        </div>
    </div>
    <script src="../js/Usuarios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
